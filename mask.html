<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HEATHENS // ENTER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020202;
    color:#fff;
    font-family:'Cormorant Garamond',serif;
}

/* =====================================================
   MAIN MASK SCREEN
===================================================== */

.mask-screen{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            ellipse at center,
            rgba(70,0,0,.16),
            #020202 65%
        );

    overflow:hidden;

    transition:
        background 1s ease;
}


/* Atmospheric red glow */

.mask-screen::before{

    content:"";

    position:absolute;

    width:650px;
    height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,30,0,.12),
            transparent 68%
        );

    filter:blur(30px);

    animation:
        atmosphere 4s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes atmosphere{

    0%,100%{
        transform:scale(.8);
        opacity:.4;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }
}


/* =====================================================
   MASK
===================================================== */

.mask-wrapper{

    position:relative;

    width:min(430px,78vw);
    aspect-ratio: .72;

    opacity:0;

    transform:
        translateY(35px)
        scale(.82);

    filter:
        brightness(.35)
        blur(8px);

    transition:none;

    z-index:5;
}


/* Mask appears */

.mask-screen.started .mask-wrapper{

    animation:
        maskArrival
        2.4s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes maskArrival{

    0%{
        opacity:0;
        transform:
            translateY(50px)
            scale(.7);
        filter:
            brightness(.15)
            blur(15px);
    }

    55%{
        opacity:1;
        transform:
            translateY(-5px)
            scale(1.04);
        filter:
            brightness(.75)
            blur(1px);
    }

    75%{
        transform:
            translateY(0)
            scale(.98);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
        filter:
            brightness(1)
            blur(0);
    }

}


/* =====================================================
   MASK SHAPE
===================================================== */

.mask{

    position:absolute;
    inset:0;

    background:

        radial-gradient(
            ellipse at 50% 32%,
            #191919 0%,
            #080808 48%,
            #010101 78%
        );

    clip-path:
        polygon(
            18% 5%,
            50% 0%,
            82% 5%,
            96% 18%,
            94% 65%,
            79% 87%,
            50% 100%,
            21% 87%,
            6% 65%,
            4% 18%
        );

    box-shadow:
        inset 0 0 45px #000,
        0 0 30px rgba(255,30,0,.25),
        0 0 90px rgba(255,20,0,.12);
}


/* =====================================================
   NEON MASK OUTLINE
===================================================== */

.mask-outline{

    position:absolute;
    inset:-3px;

    clip-path:
        polygon(
            18% 5%,
            50% 0%,
            82% 5%,
            96% 18%,
            94% 65%,
            79% 87%,
            50% 100%,
            21% 87%,
            6% 65%,
            4% 18%
        );

    background:#ff2100;

    filter:
        drop-shadow(0 0 4px #ff2100)
        drop-shadow(0 0 12px #ff2100)
        drop-shadow(0 0 28px rgba(255,30,0,.8));

    opacity:.95;
}

.mask-outline::after{

    content:"";

    position:absolute;

    inset:7px;

    background:#030303;

    clip-path:
        polygon(
            18% 5%,
            50% 0%,
            82% 5%,
            96% 18%,
            94% 65%,
            79% 87%,
            50% 100%,
            21% 87%,
            6% 65%,
            4% 18%
        );
}


/* =====================================================
   EYES
===================================================== */

.eye{

    position:absolute;

    top:28%;
    width:27%;
    height:19%;

    z-index:10;
}


/* X made from two glowing lines */

.eye::before,
.eye::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:115%;
    height:9px;

    border-radius:10px;

    background:#ff2100;

    box-shadow:
        0 0 4px #ff2100,
        0 0 10px #ff2100,
        0 0 22px #ff2100,
        0 0 45px rgba(255,30,0,.7);

    transform-origin:center;
}

.eye::before{
    transform:
        translate(-50%,-50%)
        rotate(55deg);
}

.eye::after{
    transform:
        translate(-50%,-50%)
        rotate(-55deg);
}

.eye.left{
    left:17%;
}

.eye.right{
    right:17%;
}


/* =====================================================
   INNER EYE RINGS
===================================================== */

.eye-ring{

    position:absolute;

    width:100%;
    height:100%;

    border:
        2px solid
        rgba(255,30,0,.45);

    border-radius:50%;

    box-shadow:
        inset 0 0 15px rgba(255,30,0,.15),
        0 0 12px rgba(255,30,0,.25);

}


/* =====================================================
   NOSE
===================================================== */

.nose{

    position:absolute;

    top:43%;
    left:50%;

    width:3px;
    height:23%;

    background:#ff2100;

    transform:
        translateX(-50%);

    opacity:.7;

    box-shadow:
        0 0 7px #ff2100,
        0 0 16px rgba(255,30,0,.6);
}


/* =====================================================
   MOUTH
===================================================== */

.mouth{

    position:absolute;

    left:50%;
    bottom:17%;

    width:52%;
    height:18%;

    transform:
        translateX(-50%);

    z-index:10;
}


/* Smile */

.mouth::before{

    content:"";

    position:absolute;

    left:0;
    right:0;
    top:28%;

    height:40px;

    border-bottom:
        6px solid #ff2100;

    border-radius:
        0 0 50% 50%;

    box-shadow:
        0 0 5px #ff2100,
        0 0 14px #ff2100,
        0 0 30px rgba(255,30,0,.7);
}


/* Stitch lines */

.stitches{

    position:absolute;

    inset:15% 5% 0 5%;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 13px,
            #ff2100 14px,
            #ff2100 17px,
            transparent 18px,
            transparent 28px
        );

    opacity:.9;

    filter:
        drop-shadow(0 0 5px #ff2100);
}


/* =====================================================
   FOREHEAD SYMBOL
===================================================== */

.symbol{

    position:absolute;

    top:11%;
    left:50%;

    transform:
        translateX(-50%);

    color:#ff2100;

    font-family:'Cinzel',serif;

    font-size:22px;

    letter-spacing:5px;

    text-shadow:
        0 0 6px #ff2100,
        0 0 15px #ff2100;
}


/* =====================================================
   GLITCH EFFECT
===================================================== */

.glitch{

    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:0;
}


/* horizontal glitch bars */

.glitch::before,
.glitch::after{

    content:"";

    position:absolute;

    left:-10%;
    width:120%;

    background:
        rgba(255,25,0,.35);

    mix-blend-mode:screen;
}

.glitch::before{

    top:42%;
    height:3px;
}

.glitch::after{

    top:65%;
    height:2px;
}


/* Activate glitch */

.mask-screen.glitching .glitch{

    opacity:1;

    animation:
        glitchFlash
        .16s
        steps(2)
        infinite;
}

@keyframes glitchFlash{

    0%{
        transform:translateX(0);
        opacity:.2;
    }

    25%{
        transform:translateX(-8px);
        opacity:.8;
    }

    50%{
        transform:translateX(7px);
        opacity:.4;
    }

    75%{
        transform:translateX(-3px);
        opacity:1;
    }

    100%{
        transform:translateX(0);
        opacity:.3;
    }

}


/* =====================================================
   ENTER
===================================================== */

.enter-area{

    position:absolute;

    bottom:8%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:30;

    text-align:center;

    opacity:0;

    transition:
        opacity 1.5s ease;
}

.mask-screen.ready .enter-area{

    opacity:1;
}


.enter-label{

    font-family:'Cinzel',serif;

    font-size:12px;

    letter-spacing:5px;

    color:#c9c0b1;

    margin-bottom:10px;
}


.enter-button{

    border:1px solid #ff2100;

    background:transparent;

    color:#ff2100;

    padding:12px 38px;

    font-family:'Cinzel',serif;

    font-size:14px;

    letter-spacing:5px;

    cursor:pointer;

    box-shadow:
        0 0 8px rgba(255,30,0,.25);

    transition:
        .3s ease;
}

.enter-button:hover{

    background:#ff2100;

    color:#050505;

    box-shadow:
        0 0 12px #ff2100,
        0 0 30px rgba(255,30,0,.7);
}


/* =====================================================
   BLANK SCREEN
===================================================== */

.blackout{

    position:fixed;

    inset:0;

    background:#000;

    z-index:100;

    opacity:0;

    visibility:hidden;

    transition:
        opacity 1.2s ease;
}

.blackout.active{

    opacity:1;

    visibility:visible;
}


/* =====================================================
   SECRET MESSAGE
===================================================== */

.secret{

    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:#000;

    opacity:0;

    visibility:hidden;

    transition:
        opacity 2.5s ease;
}

.secret.show{

    opacity:1;

    visibility:visible;
}


.secret-text{

    color:#f0e6d4;

    font-family:'Cinzel',serif;

    font-size:
        clamp(
            26px,
            5vw,
            58px
        );

    font-weight:600;

    letter-spacing:
        clamp(
            4px,
            1vw,
            12px
        );

    text-transform:uppercase;

    text-shadow:
        0 0 8px rgba(255,255,255,.25);

    animation:
        secretPulse
        5s
        ease-in-out
        infinite;
}

@keyframes secretPulse{

    0%,100%{
        opacity:.78;
        text-shadow:
            0 0 5px rgba(255,255,255,.15);
    }

    50%{
        opacity:1;
        text-shadow:
            0 0 12px rgba(255,255,255,.35),
            0 0 30px rgba(122,14,22,.35);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .mask-wrapper{
        width:82vw;
    }

    .enter-area{
        bottom:5%;
    }

    .eye::before,
    .eye::after{
        height:6px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     MASK PAGE
===================================================== -->

<div
    class="mask-screen"
    id="maskScreen"
>

    <div
        class="mask-wrapper"
        id="maskWrapper"
    >

        <div class="mask-outline"></div>

        <div class="mask">

            <div class="symbol">
                H
            </div>

            <div class="eye left">
                <div class="eye-ring"></div>
            </div>

            <div class="eye right">
                <div class="eye-ring"></div>
            </div>

            <div class="nose"></div>

            <div class="mouth">
                <div class="stitches"></div>
            </div>

        </div>

        <div class="glitch"></div>

    </div>


    <!-- ENTER BUTTON -->

    <div class="enter-area">

        <div class="enter-label">
            YOU HAVE BEEN CHOSEN
        </div>

        <button
            class="enter-button"
            onclick="beginReveal()"
        >
            ENTER
        </button>

    </div>

</div>


<!-- =====================================================
     BLACKOUT
===================================================== -->

<div
    class="blackout"
    id="blackout"
></div>


<!-- =====================================================
     SECRET MESSAGE
===================================================== -->

<div
    class="secret"
    id="secret"
>

    <div class="secret-text">
        RUN, LITTLE RABBIT.
    </div>

</div>


<script>

/* =====================================================
   MASK INTRO
===================================================== */

const maskScreen =
    document.getElementById("maskScreen");

const blackout =
    document.getElementById("blackout");

const secret =
    document.getElementById("secret");


/*
    The mask slowly emerges when
    the page loads.
*/

window.addEventListener("load", function(){

    setTimeout(function(){

        maskScreen.classList.add("started");

    }, 400);

    /*
        Give the visitor time to see
        the mask before revealing ENTER.
    */

    setTimeout(function(){

        maskScreen.classList.add("ready");

    }, 3000);

});


/* =====================================================
   ENTER → GLITCH → BLACKOUT → MESSAGE
===================================================== */

function beginReveal(){

    /*
        Remove the ENTER button.
    */

    const enter =
        document.querySelector(".enter-area");

    enter.style.opacity = "0";
    enter.style.pointerEvents = "none";


    /*
        Start the violent glitch.
    */

    setTimeout(function(){

        maskScreen.classList.add("glitching");

    }, 200);


    /*
        Increase the glitch intensity.
    */

    setTimeout(function(){

        maskScreen.style.filter =
            "contrast(1.5) brightness(1.5)";

        maskScreen.style.transform =
            "scale(1.02)";

    }, 900);


    /*
        HARD GLITCH.
    */

    setTimeout(function(){

        maskScreen.style.filter =
            "contrast(2) brightness(2)";

        maskScreen.style.transform =
            "translateX(-5px)";

    }, 1300);


    setTimeout(function(){

        maskScreen.style.transform =
            "translateX(6px)";

    }, 1400);


    setTimeout(function(){

        maskScreen.style.transform =
            "translateX(0) scale(1.04)";

    }, 1500);


    /*
        Suddenly cut to black.
    */

    setTimeout(function(){

        blackout.classList.add("active");

    }, 1750);


    /*
        Remove the mask completely.
    */

    setTimeout(function(){

        maskScreen.style.display = "none";

    }, 3000);


    /*
        Leave the screen completely black
        for a moment.
    */

    setTimeout(function(){

        secret.classList.add("show");

    }, 5000);

}

</script>

</body>
</html>
